<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Đặt Lịch</title>
    <link rel="stylesheet" href="XemTTLichKham.css">
</head>

<body>
    <header class="full-width-header">
        <div class="welcome-banner">
            Xin chào, Lễ tân <a href="QLDatLich.html"><span id="usernameDisplay">...</span></a>! <span>⬅ Nhấn để quay lại</span>
        </div>
    </header>

    <main class="container-management">
        <div class="table-section">
			<p style="margin-bottom: 10px; color: #666;">Chọn <b>Mã đặt lịch</b> để xác nhận</p>
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>Mã đặt lịch</th>
                        <th>Ngày khám</th>
                        <th>Bác sĩ</th>
                        <th>Bệnh nhân</th>
                        <th>Dịch vụ</th>
                        <th>Tình trạng</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div class="action-section">
            <button class="action-btn find" onclick="findCustomer()">Tìm kiếm lịch khám</button>
        </div>
    </main>
	
	<div id="actionModal" class="modal">
		<div class="modal-content">
			<h3>Thao tác lịch khám</h3>
			<p id="selectedMaDLText"></p>
			<div class="modal-actions">
				<button class="action-btn find" onclick="checkAvailability()">Kiểm tra khả dụng</button>
				<button class="action-btn add" onclick="confirmAppointment()">Xác nhận đặt lịch</button>
				<button class="action-btn delete" onclick="closeModal('actionModal')">Quay lại</button>
			</div>
		</div>
	</div>

	<div id="searchModal" class="modal">
		<div class="modal-content">
			<h3>Tìm kiếm lịch khám</h3>
			<input type="text" id="sMaDL" placeholder="Mã đặt lịch">
			<input type="date" id="sNgay">
			<input type="text" id="sBacSi" placeholder="Tên Bác sĩ">
			<input type="text" id="sBenhNhan" placeholder="Tên Bệnh nhân">
			<input type="text" id="sDichVu" placeholder="Tên Dịch vụ">
			<select id="sTinhTrang">
				<option value="">Tất cả trạng thái</option>
				<option value="ChoXN" style="color: #1221f3;">Chờ xác nhận</option>
				<option value="DaXN" style="color: #27ae60;">Đã xác nhận</option>
			</select>
			<div class="modal-actions">
				<button class="action-btn find" onclick="applySearch()">Lọc dữ liệu</button>
				<button class="action-btn delete" onclick="closeModal('searchModal')">Đóng</button>
			</div>
		</div>
	</div>

    <script src="XNDatLK.js"></script>
</body>

</html>
