<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Lịch Khám</title>
    <link rel="stylesheet" href="XemTTLichKham.css">
</head>

<body>
    <header class="full-width-header">
        <div class="welcome-banner">
            Xin chào, Lễ tân <a href="QLDatLich.html"><span id="usernameDisplay">...</span></a>! <span>⬅ Nhấn để quay lại</span>
        </div>
    </header>

    <main class="container-management">
        <div class="table-section">
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>Mã đặt lịch</th>
                        <th>Ngày khám</th>
                        <th>Bác sĩ</th>
                        <th>Bệnh nhân</th>
                        <th>Dịch vụ</th>
                        <th>Tình trạng</th>
                        <th>Khách đến khám</th>
                        <th>Đánh giá</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div class="action-section">
            <button class="action-btn find" onclick="findCustomer()">Tìm kiếm lịch khám</button>
        </div>
    </main>
	
	<div id="searchModal" class="modal">
		<div class="modal-content">
			<h3>Tìm kiếm lịch khám</h3>
			<label>Mã đặt lịch:</label>
			<input type="text" id="searchMaDL" placeholder="Nhập mã...">

			<label>Ngày khám:</label>
			<input type="date" id="searchNgay">

			<label>Tên Bệnh nhân:</label>
			<input type="text" id="searchBenhNhan" placeholder="Tên khách hàng...">

			<label>Tên Bác sĩ:</label>
			<input type="text" id="searchBacSi" placeholder="Tên bác sĩ...">

			<div class="modal-actions">
				<button class="action-btn find" onclick="executeSearch()">Tìm kiếm</button>
				<button class="action-btn delete" onclick="closeSearchModal()">Đóng</button>
			</div>
		</div>
	</div>
	
	<div id="ratingDetailModal" class="modal">
		<div class="modal-content">
			<h3 style="border-bottom: 1px solid grey; padding-bottom: 10px; margin-bottom: 10px;">Chi tiết đánh giá</h3>
			<div id="ratingContent">
				</div>
			<div class="modal-actions">
				<button class="action-btn delete" onclick="closeRatingModal()">Đóng</button>
			</div>
		</div>
	</div>

    <script src="XemTTLichKham.js"></script>
</body>

</html>
