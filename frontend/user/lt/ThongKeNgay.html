<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Theo Ngày</title>
    <link rel="stylesheet" href="ThongKeNgay.css">
</head>

<body>
    <header class="full-width-header">
        <div class="welcome-banner">
            Xin chào, Lễ tân <a href="BaoCao.html"><span id="usernameDisplay">letan00</span></a>! <span>⬅ Nhấn để quay lại</span>
        </div>
    </header>

    <main class="container-management">
        <div class="table-section">
            <table id="thongKeTable">
				<thead>
					<tr>
						<th>Ngày Thống Kê</th>
						<th>Tổng Lịch Đặt</th>
						<th>Số Lịch Hủy</th>
						<th>Số Khách Đến</th>
					</tr>
				</thead>
				<tbody id="thongKeBody"></tbody>
        </table>
        </div>

        <div class="action-section">
			<input type="date" id="filterDate" class="action-btn" style="background: white; color: black;">
            <button class="action-btn add" onclick="createReport()">Tạo báo cáo</button>
            <button class="action-btn find" onclick="findNgay()">Lọc theo ngày</button>
        </div>
    </main>

    <script src="ThongKeNgay.js"></script>
</body>

</html>
