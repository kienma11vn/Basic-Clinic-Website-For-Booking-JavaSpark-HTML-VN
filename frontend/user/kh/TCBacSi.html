<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Bác Sĩ</title>
    <link rel="stylesheet" href="TCBacSi.css">
</head>

<body>
    <header class="full-width-header">
        <div class="welcome-banner">
            Xin chào, Người dùng <a href="TraCuuTT.html"><span id="usernameDisplay">khachhang00</span></a>! <span>⬅ Nhấn để quay lại</span>
        </div>
    </header>

    <main class="container-management">
        <div class="table-section">
			<p style="margin-bottom: 10px; color: #666;">Chọn <b>Họ tên bác sĩ</b> để xem chi tiết thông tin</p>
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>Mã bác sĩ</th>
                        <th>Họ tên bác sĩ</th>
                        <th>Tên chuyên khoa</th>
                        <th>Chức danh</th>
                        <th>Thâm niên</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div class="action-section">
            <button class="action-btn find" onclick="openSearchModal()">Tìm kiếm bác sĩ</button>
        </div>
    </main>
	
	<div id="searchModal" class="modal">
		<div class="modal-content">
			<h3 style="margin-bottom: 15px; text-align: center;">Tìm kiếm bác sĩ</h3>
			
			<label>Họ tên bác sĩ:</label>
			<input type="text" id="findName" placeholder="Nhập tên...">

			<label>Chuyên khoa:</label>
			<input type="text" id="findCK" placeholder="Nhập chuyên khoa...">

			<label>Chức danh:</label>
			<input type="text" id="findCD" placeholder="Nhập chức danh...">

			<label>Thâm niên:</label>
			<input type="number" id="findTN" placeholder="Ví dụ: 5">

			<label for="findGT">Giới tính:</label>
			<select id="findGT" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-top: 5px;">
				<option value="">-- Tất cả --</option>
				<option value="Nam">Nam</option>
				<option value="Nu">Nữ</option>
			</select>

			<div class="modal-actions">
				<button class="action-btn find" onclick="executeSearch()" style="flex: 1;">Tìm ngay</button>
				<button class="action-btn" onclick="closeSearchModal()" style="flex: 1; background: #666; color: white;">Hủy</button>
			</div>
		</div>
	</div>

	<div id="detailModal" class="modal">
		<div class="modal-content">
			<div id="detailContent"></div>
		</div>
	</div>

    <script src="TCBacSi.js"></script>
</body>

</html>
